<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0f1a">
  <title>BetterLife</title>
  <link rel="manifest" href="manifest.json">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1a;
      --card: #111827;
      --card-hover: #1a2234;
      --accent: #22c55e;
      --accent-dim: #166534;
      --accent-glow: rgba(34, 197, 94, 0.12);
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --border: #1e293b;
      --protein: #3b82f6;
      --carbs: #f59e0b;
      --fat: #ef4444;
      --water: #06b6d4;
      --red: #ef4444;
      --red-dim: rgba(239, 68, 68, 0.15);
      --yellow: #f59e0b;
      --yellow-dim: rgba(245, 158, 11, 0.12);
      --purple: #a78bfa;
      --purple-dim: rgba(167, 139, 250, 0.12);
      --nav-height: 65px;
      --header-height: 70px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      padding-top: var(--header-height);
      padding-bottom: calc(var(--nav-height) + 20px);
    }

    /* === HEADER === */
    .header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-inner {
      flex: 1;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title-box {
      display: flex;
      flex-direction: column;
    }

    .header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
    }

    .header h1 span {
      color: var(--accent);
    }

    .header p {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    .clock-widget {
      text-align: right;
    }

    .clock-time {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    .clock-date {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* === BOTTOM NAV === */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 100;
      display: flex;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      max-width: 600px;
      height: 100%;
    }

    .nav-item {
      background: none;
      border: none;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      height: 100%;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-icon {
      font-size: 20px;
      margin-bottom: 4px;
      transition: transform 0.2s;
    }

    .nav-item.active .nav-icon {
      transform: translateY(-2px);
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
    }

    /* === CONTENT === */
    .content {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    h2 {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* === CARDS === */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .card.highlight-now {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }

    .card.highlight-now::before {
      content: 'NOW';
      position: absolute;
      top: 0;
      right: 0;
      background: var(--accent);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-bottom-left-radius: 8px;
    }

    .card-accent {
      background: var(--accent-glow);
      border-color: var(--accent-dim);
    }

    .card-red {
      background: var(--red-dim);
      border-color: rgba(239, 68, 68, 0.25);
    }

    .card-purple {
      background: var(--purple-dim);
      border-color: rgba(167, 139, 250, 0.25);
    }

    .card-yellow {
      background: var(--yellow-dim);
      border-color: rgba(245, 158, 11, 0.25);
    }

    /* === BADGES === */
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .badge-green {
      color: var(--accent);
      background: var(--accent-glow);
    }

    .badge-yellow {
      color: var(--yellow);
      background: var(--yellow-dim);
    }

    .badge-muted {
      color: var(--text-dim);
      background: var(--border);
    }

    .badge-purple {
      color: var(--purple);
      background: var(--purple-dim);
    }

    /* === MACROS === */
    .macro-row {
      display: flex;
      gap: 12px;
      font-size: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
      font-weight: 600;
    }

    .macro-p {
      color: var(--protein);
    }

    .macro-c {
      color: var(--carbs);
    }

    .macro-f {
      color: var(--fat);
    }

    .macro-s {
      color: var(--red);
    }

    /* === SWAPS === */
    .swap-header {
      cursor: pointer;
      padding: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .swap-detail {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .swap-tip {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
    }

    /* === FORM ELEMENTS === */
    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      transition: border 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent);
    }

    .trainer-notes {
      width: 100%;
      min-height: 100px;
      background: rgba(245, 158, 11, 0.05);
      border: 1px solid var(--yellow-dim);
      color: var(--yellow);
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      line-height: 1.5;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
      font-family: inherit;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .btn-primary:active {
      opacity: 0.8;
    }

    /* === WATER === */
    .water-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .water-drop {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s;
    }

    .water-drop.filled {
      background: var(--water);
      opacity: 1;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }

    .water-drop.empty {
      background: var(--border);
      opacity: 0.4;
    }

    /* === SUPPLEMENTS === */
    .supp-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      margin-bottom: 10px;
      transition: all 0.2s;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      text-align: left;
    }

    .supp-btn.taken {
      background: var(--purple-dim);
      border-color: rgba(167, 139, 250, 0.3);
    }

    .supp-check {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .supp-btn.taken .supp-check {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
    }

    /* === DO THIS NOW === */
    .do-this-now {
      background: var(--card);
      border: 1px solid var(--accent-dim);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* === PROGRESS RING === */
    .progress-ring-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* === QUICK ACTION BUTTONS === */
    .quick-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .quick-btn {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      color: var(--text);
    }

    .quick-btn:active {
      transform: scale(0.95);
      background: var(--card-hover);
    }

    .quick-btn-icon {
      font-size: 24px;
    }

    .quick-btn-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
    }

    /* === OVERLAY / MODAL === */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-content {
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    /* === MEAL FILTER === */
    .meal-filter-btn {
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.15s;
    }

    .meal-filter-btn.active {
      background: var(--accent-glow) !important;
      color: var(--accent) !important;
    }

    /* === UTILITIES === */
    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* Select styling */
    select.input-field {
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-inner">
      <div class="header-title-box">
        <h1><span>♥</span> BETTERLIFE</h1>
        <p>YOUR PERSONAL HEALTH SYSTEM</p>
      </div>
      <div class="clock-widget">
        <div class="clock-time" id="liveTime">--:--</div>
        <div class="clock-date" id="liveDate">---</div>
      </div>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="bottom-nav">
    <div class="bottom-nav-inner" id="navContainer"></div>
  </div>

  <!-- Overlay / Modal -->
  <div class="overlay hidden" id="overlay">
    <div class="overlay-content" id="overlayContent"></div>
  </div>

  <!-- Scripts (load order matters) -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/coaching.js"></script>
  <script src="js/tab-today.js"></script>
  <script src="js/tab-nutrition.js"></script>
  <script src="js/tab-body.js"></script>
  <script src="js/tab-routine.js"></script>
  <script src="js/tab-me.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
