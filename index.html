<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1a">
<title>Barber's Cut — Meal System</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0f1a;
  --card: #111827;
  --card-hover: #1a2234;
  --accent: #22c55e;
  --accent-dim: #166534;
  --accent-glow: rgba(34,197,94,0.12);
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --border: #1e293b;
  --protein: #3b82f6;
  --carbs: #f59e0b;
  --fat: #ef4444;
  --water: #06b6d4;
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.15);
  --yellow: #f59e0b;
  --yellow-dim: rgba(245,158,11,0.12);
  --purple: #a78bfa;
  --purple-dim: rgba(167,139,250,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', -apple-system, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

.header {
  background: linear-gradient(135deg, var(--card) 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border);
  padding: 20px 16px 14px;
}
.header-inner { max-width: 600px; margin: 0 auto; }
.header h1 {
  font-family: 'Space Mono', monospace;
  font-size: 20px;
  font-weight: 700;
}
.header h1 span { color: var(--accent); }
.header p {
  color: var(--text-muted);
  font-size: 12px;
  margin-top: 4px;
  letter-spacing: 0.3px;
}

.tabs {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs-inner { max-width: 600px; margin: 0 auto; display: flex; padding: 0 8px; }
.tab {
  background: none; border: none; padding: 11px 11px; cursor: pointer;
  color: var(--text-muted); border-bottom: 2px solid transparent;
  font-size: 12px; font-weight: 600; font-family: 'DM Sans', sans-serif;
  flex-shrink: 0; transition: all 0.2s;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.content { max-width: 600px; margin: 0 auto; padding: 16px 16px 100px; }

h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
h3 { font-size: 14px; font-weight: 700; }

.subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
  transition: all 0.2s;
}

.card-accent {
  background: var(--accent-glow);
  border-color: var(--accent-dim);
}

.card-red {
  background: var(--red-dim);
  border-color: rgba(239,68,68,0.25);
}

.card-purple {
  background: var(--purple-dim);
  border-color: rgba(167,139,250,0.25);
}

.badge {
  font-size: 11px; font-weight: 600; padding: 3px 8px;
  border-radius: 6px; display: inline-block;
}
.badge-green { color: var(--accent); background: var(--accent-glow); }
.badge-yellow { color: var(--yellow); background: var(--yellow-dim); }
.badge-muted { color: var(--text-dim); background: var(--border); }
.badge-purple { color: var(--purple); background: var(--purple-dim); }

.macro-row { display: flex; gap: 10px; font-size: 11px; margin-top: 6px; flex-wrap: wrap; }
.macro-p { color: var(--protein); }
.macro-c { color: var(--carbs); }
.macro-f { color: var(--fat); }
.macro-s { color: var(--red); font-weight: 600; }

.bar-wrap { margin-bottom: 10px; }
.bar-label { display: flex; justify-content: space-between; margin-bottom: 3px; font-size: 12px; }
.bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

.swap-header { cursor: pointer; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
.swap-detail { padding: 0 14px 14px; border-top: 1px solid var(--border); padding-top: 10px; }
.swap-tip { font-size: 12px; color: var(--text-dim); line-height: 1.6; background: var(--accent-glow); padding: 10px; border-radius: 8px; }

.expand-arrow { font-size: 14px; color: var(--text-muted); transition: transform 0.2s; display: inline-block; }
.expand-arrow.open { transform: rotate(180deg); }

.water-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.water-drop {
  width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all 0.2s;
}
.water-drop.filled { background: var(--water); opacity: 1; }
.water-drop.empty { background: var(--border); opacity: 0.4; }

.supp-btn {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card);
  margin-bottom: 8px; transition: all 0.2s; width: 100%;
  font-family: 'DM Sans', sans-serif; color: var(--text);
}
.supp-btn.taken {
  background: var(--purple-dim);
  border-color: rgba(167,139,250,0.3);
}
.supp-check {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border); display: flex;
  align-items: center; justify-content: center;
  font-size: 14px; transition: all 0.2s; flex-shrink: 0;
}
.supp-btn.taken .supp-check {
  background: var(--purple);
  border-color: var(--purple);
  color: var(--bg);
}

.rule-num {
  font-family: 'Space Mono', monospace;
  font-size: 24px; font-weight: 700;
  color: var(--accent-dim); line-height: 1;
}

.tip-box {
  font-size: 11px; color: var(--accent); font-weight: 600;
  background: var(--accent-glow); padding: 6px 10px;
  border-radius: 6px; display: inline-block; margin-top: 8px;
}

.yellow-note {
  font-size: 11px; color: var(--yellow); margin-top: 8px;
  background: var(--yellow-dim); padding: 6px 8px; border-radius: 6px;
}

.hidden { display: none; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: fadeIn 0.3s ease; }

.streak-bar {
  display: flex; gap: 4px; margin-top: 8px;
}
.streak-day {
  flex: 1; height: 6px; border-radius: 3px; transition: background 0.3s;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1><span>✂</span> BARBER'S CUT</h1>
    <p>REAL-LIFE MEAL SYSTEM — NO COOKING AT WORK, NO BS</p>
  </div>
</div>

<div class="tabs">
  <div class="tabs-inner" id="tabsContainer"></div>
</div>

<div class="content" id="content"></div>

<script>
// === STATE ===
const state = {
  activeTab: 'swaps',
  waterCount: parseInt(localStorage.getItem('bc_water') || '0'),
  probTaken: localStorage.getItem('bc_prob') === 'true',
  vitTaken: localStorage.getItem('bc_vit') === 'true',
  expandedSwaps: {},
  expandedMonday: null,
  checkedMeals: JSON.parse(localStorage.getItem('bc_meals') || '{}'),
  lastDate: localStorage.getItem('bc_date') || '',
  streak: JSON.parse(localStorage.getItem('bc_streak') || '[]'),
};

// Reset daily trackers if new day
const today = new Date().toDateString();
if (state.lastDate !== today) {
  state.waterCount = 0;
  state.probTaken = false;
  state.vitTaken = false;
  state.checkedMeals = {};
  localStorage.setItem('bc_water', '0');
  localStorage.setItem('bc_prob', 'false');
  localStorage.setItem('bc_vit', 'false');
  localStorage.setItem('bc_meals', '{}');
  localStorage.setItem('bc_date', today);

  // Update streak
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  if (state.lastDate === yesterday.toDateString()) {
    // continuing streak
  }
}

function save(key, val) {
  localStorage.setItem(key, typeof val === 'object' ? JSON.stringify(val) : String(val));
}

// === DATA ===
const TABS = [
  { id: 'swaps', label: '🔄 Swaps' },
  { id: 'week', label: '📅 Week' },
  { id: 'monday', label: '🏠 Monday' },
  { id: 'supps', label: '💊 Supps' },
  { id: 'prep', label: '🔪 Prep' },
  { id: 'rules', label: '⚡ Rules' },
];

const WORK_MEALS = {
  morning: {
    label: '☕ Morning (Before/Early Shift)',
    current: { name: "Dunkin' Latte", cals: 350, protein: 8, carbs: 56, fat: 10, sugar: '48g sugar' },
    swaps: [
      { name: "Dunkin' Iced Coffee w/ Cream (no sugar)", cals: 50, protein: 1, carbs: 2, fat: 4, sugar: '0g sugar', tip: 'Order "iced coffee with cream, no liquid sugar, no swirl." Save ~300 cal and 48g sugar daily. This alone drops 1 lb every 12 days.', difficulty: '🟢 Easy' },
      { name: "Dunkin' Cold Brew w/ Cream", cals: 30, protein: 1, carbs: 1, fat: 3, sugar: '0g sugar', tip: 'Even less calories. Smoother taste. Ask for cold brew with a splash of cream. Nothing else.', difficulty: '🟢 Easy' },
      { name: "Dunkin' Wake-Up Wrap (Egg & Cheese)", cals: 180, protein: 10, carbs: 14, fat: 9, sugar: '1g sugar', tip: 'If you need food in the morning, grab this WITH your unsweetened coffee. Small, fast to eat between clients.', difficulty: '🟢 Easy' },
    ]
  },
  lunch: {
    label: '🥙 Mid-Day (1-3pm Quick Run)',
    current: { name: 'Boom Boom Chicken Wrap', cals: 780, protein: 35, carbs: 62, fat: 42, sugar: '~8g sugar' },
    swaps: [
      { name: 'Deli Grilled Chicken Salad (oil & vinegar)', cals: 380, protein: 38, carbs: 12, fat: 18, sugar: '2g sugar', tip: 'Ask for grilled chicken over lettuce/spinach with oil & vinegar. Skip the creamy dressing. Most delis make this in 3 min — same speed as a wrap.', difficulty: '🟢 Easy' },
      { name: 'Deli Chicken Cutlet over Salad', cals: 480, protein: 40, carbs: 20, fat: 26, sugar: '3g sugar', tip: "If you want something more filling, get the cutlet (fried is fine sometimes) but put it over salad instead of in bread. Cuts ~300 cal vs a hero.", difficulty: '🟡 Medium' },
      { name: 'Chick-fil-A: Grilled Nuggets (12pc) + Side Salad', cals: 310, protein: 38, carbs: 16, fat: 10, sugar: '3g sugar', tip: "12-piece grilled nuggets (not fried) + side salad with light dressing. High protein, low sugar, and Chick-fil-A speed means you're back in the chair fast.", difficulty: '🟢 Easy' },
      { name: 'Chick-fil-A: Grilled Sandwich (no bun)', cals: 200, protein: 29, carbs: 4, fat: 7, sugar: '1g sugar', tip: "Ask for the grilled sandwich with no bun in a bowl. Add a side salad. Total: ~310 cal. They'll do it, it's not weird.", difficulty: '🟡 Medium' },
    ]
  },
  dinner: {
    label: "🌙 Dinner (Home — Siblings' Choice)",
    current: { name: "McDonald's / Pizza / Uber Eats", cals: 1100, protein: 35, carbs: 110, fat: 55, sugar: '~30g sugar' },
    swaps: [
      { name: "McDonald's: 2 McChicken (no mayo) + Water", cals: 530, protein: 28, carbs: 62, fat: 18, sugar: '6g sugar', tip: "When siblings want McD's — get 2 McChickens, ask for no mayo. Skip the fries and soda. You save ~600 calories vs a Big Mac meal.", difficulty: '🟢 Easy' },
      { name: "McDonald's: 2 Grilled Chicken Wraps", cals: 500, protein: 38, carbs: 44, fat: 18, sugar: '4g sugar', tip: "McD's snack wraps if available — or 2 McChickens, ditch the top bun on each (open-faced). Pair with water.", difficulty: '🟡 Medium' },
      { name: 'Pizza: 2 Slices Plain + Side Salad', cals: 580, protein: 24, carbs: 64, fat: 24, sugar: '8g sugar', tip: "When it's pizza night: ONLY 2 slices (not 3-4). Plain cheese or one topping. Ask for a side salad with oil & vinegar. Eat the salad first so you're less tempted to grab slice #3.", difficulty: '🟡 Medium' },
      { name: 'Uber Eats: Chipotle Bowl (no rice/sour cream)', cals: 510, protein: 46, carbs: 28, fat: 22, sugar: '4g sugar', tip: "If ordering Uber Eats — Chipotle burrito bowl: double chicken, fajita veggies, lettuce, pico, guac (small). Skip rice, beans, sour cream, cheese. Filling, high protein.", difficulty: '🟡 Medium' },
    ]
  }
};

const MONDAY_MEALS = [
  { time: '8:00 AM', name: 'Oatmeal + Almonds + Coffee (no sugar)', cals: 340, protein: 14, carbs: 44, fat: 13, recipe: '½ cup oats in water, top with almonds, cinnamon. Coffee with cream, no sugar.' },
  { time: '10:00 AM', name: '💊 Probiotic + Multivitamin', cals: 0, protein: 0, carbs: 0, fat: 0, recipe: 'Take your Spring Valley Probiotic and Equate Multivitamin with a full glass of water after breakfast. Take both at the same time so you don\'t forget.' },
  { time: '11:00 AM', name: 'Scrambled Eggs + Spinach', cals: 280, protein: 22, carbs: 4, fat: 18, recipe: '3 eggs scrambled with spinach in olive oil. Salt, pepper, garlic powder.' },
  { time: '2:00 PM', name: 'Grilled Chicken + Spinach Salad', cals: 400, protein: 46, carbs: 6, fat: 20, recipe: '6oz chicken over spinach with olive oil drizzle. Batch cook extra chicken for the week while you\'re at it.' },
  { time: '5:00 PM', name: 'Greek Yogurt + Almonds', cals: 180, protein: 20, carbs: 8, fat: 7, recipe: '1 cup yogurt + handful of almonds. Quick and clean.' },
  { time: '7:30 PM', name: 'Chicken + Soup or Eggs', cals: 380, protein: 40, carbs: 18, fat: 14, recipe: 'Leftover chicken + Lipton soup with spinach, or chicken + scrambled eggs.' },
];

const WEEKLY_VIEW = [
  { day: 'MON (Off)', morning: 'Oatmeal + Almonds + 💊 Supps', midday: 'Eggs + Spinach / Chicken Salad', dinner: 'Home cooked chicken meal', notes: 'Prep day. Cook everything. Take supps with breakfast.', cals: '~1,580' },
  { day: 'TUE', morning: 'Dunkin\' Cold Brew + 💊 Supps w/ eggs at shop', midday: 'Deli grilled chicken salad', dinner: '2 McChicken no mayo (if sibs want McD\'s)', notes: 'Take supps with your prepped eggs mid-morning.', cals: '~1,400' },
  { day: 'WED', morning: 'Overnight oats (prepped Mon) + 💊 Supps', midday: 'Chick-fil-A grilled nuggets + salad', dinner: 'Uber Eats Chipotle bowl (no rice)', notes: 'Supps with oats. Eat eggs before ordering dinner.', cals: '~1,450' },
  { day: 'THU', morning: 'Dunkin\' Cold Brew + Wake-Up Wrap + 💊', midday: 'Deli chicken cutlet over salad', dinner: '2 slices pizza + side salad', notes: 'Take supps with the Wake-Up Wrap. Salad first, then pizza.', cals: '~1,500' },
  { day: 'FRI', morning: 'Dunkin\' Cold Brew + 💊 w/ eggs', midday: 'Chick-fil-A grilled sandwich (no bun)', dinner: 'Grilled chicken from Uber Eats', notes: 'Supps + eggs mid-morning. Almonds between clients.', cals: '~1,350' },
  { day: 'SAT', morning: 'Overnight oats or Cold Brew + Wrap + 💊', midday: 'Deli grilled chicken salad', dinner: 'Use the swap guide for whatever sibs want', notes: 'Busy day. Lean on prepped food. Don\'t skip supps.', cals: '~1,400-1,600' },
  { day: 'SUN', morning: 'Eggs + Oatmeal at home + 💊', midday: 'Deli / Chick-fil-A swap', dinner: 'Home or Uber Eats — grilled option', notes: 'If off: cook. If working: same as weekday.', cals: '~1,400-1,600' },
];

const PREP_TASKS = [
  { task: 'Bake ALL the chicken (3 lbs) — slice, store in 5 containers', time: '25 min', why: 'Grab-and-go chicken for work days. Eat cold, reheat at home, or toss on a deli salad.' },
  { task: 'Hard boil 10 eggs — peel, container, fridge', time: '15 min', why: '2 eggs = quick protein when you get home. Eat before siblings order food so you\'re not starving.' },
  { task: 'Portion almonds into small bags (7 bags, ~23 each)', time: '5 min', why: 'Toss a bag in your barber bag. Snack between clients instead of nothing.' },
  { task: 'Prep overnight oats for Tue/Wed (oats + yogurt + water → fridge)', time: '3 min', why: 'Grab and eat on the way to the shop. Skip the Dunkin\' line.' },
  { task: 'Wash & bag spinach with paper towel', time: '5 min', why: 'Ready-to-eat greens all week.' },
  { task: 'Set daily phone alarm: "💊 Take supps" at 9 AM', time: '1 min', why: 'The probiotic rebuilds your gut after the reset. The multivitamin covers gaps while you transition. Both need to become automatic.' },
];

const SUPPS_DATA = [
  {
    name: 'Spring Valley Daily Probiotic',
    icon: '🦠',
    when: 'Every morning with food',
    why: 'After your gut reset, your good bacteria got wiped out along with the bad. This puts the good ones back. Take it every single day for at least 30 days straight — no skipping. After 30 days, your digestion, bloating, and even cravings will noticeably improve.',
    howTo: 'Take 1 capsule with breakfast or your first meal. Needs food in your stomach to work best. On work days, take it with your prepped eggs or overnight oats — not with just coffee.',
    warning: 'Don\'t take on a completely empty stomach. Mild bloating the first few days is normal — your gut is adjusting. If it lasts more than a week, take it at night instead.',
    duration: '30 days minimum, then ongoing',
    stateKey: 'probTaken',
    saveKey: 'bc_prob',
  },
  {
    name: 'Equate Men\'s One Daily Multivitamin',
    icon: '💊',
    when: 'With your biggest meal (lunch or dinner)',
    why: 'You\'re switching from fast food that\'s high calorie but nutrient-empty to real food. During this transition, your body might be short on vitamins and minerals it\'s used to getting from fortified junk food. The multi fills those gaps so you don\'t feel run down.',
    howTo: 'Take 1 tablet with your largest meal of the day. Fat-soluble vitamins (A, D, E, K) absorb better with food that has some fat in it. On Mondays, take with your chicken + spinach lunch. On work days, take with dinner.',
    warning: 'Can cause nausea if taken without food. If you feel queasy, switch to taking it at dinner. Don\'t double up if you miss a day — just take one the next day.',
    duration: 'Ongoing — every day',
    stateKey: 'vitTaken',
    saveKey: 'bc_vit',
  }
];

// === RENDER ENGINE ===
function renderTabs() {
  const container = document.getElementById('tabsContainer');
  container.innerHTML = TABS.map(t =>
    `<button class="tab ${state.activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');
  container.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab;
      renderTabs();
      renderContent();
    });
  });
}

function renderContent() {
  const el = document.getElementById('content');
  el.className = 'content animate-in';
  switch(state.activeTab) {
    case 'swaps': el.innerHTML = renderSwaps(); break;
    case 'week': el.innerHTML = renderWeek(); break;
    case 'monday': el.innerHTML = renderMonday(); break;
    case 'supps': el.innerHTML = renderSupps(); break;
    case 'prep': el.innerHTML = renderPrep(); break;
    case 'rules': el.innerHTML = renderRules(); break;
  }
  attachEvents();
}

function renderSwaps() {
  let html = `<h2>Work Day Food Swaps</h2><p class="subtitle">Same places you already eat. Just smarter orders. No extra time.</p>`;
  
  for (const [cat, data] of Object.entries(WORK_MEALS)) {
    html += `<h3 style="color:var(--text-dim);margin:16px 0 10px">${data.label}</h3>`;
    
    // Current order
    html += `
      <div class="card card-red">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:10px;color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px">❌ Your Current Order</div>
            <div style="font-size:14px;font-weight:600">${data.current.name}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:16px;font-weight:700;color:var(--red)">${data.current.cals}</div>
            <div style="font-size:10px;color:var(--text-muted)">cal</div>
          </div>
        </div>
        <div class="macro-row">
          <span class="macro-p">P: ${data.current.protein}g</span>
          <span class="macro-c">C: ${data.current.carbs}g</span>
          <span class="macro-f">F: ${data.current.fat}g</span>
          <span class="macro-s">🍬 ${data.current.sugar}</span>
        </div>
      </div>`;
    
    // Swaps
    data.swaps.forEach((sw, i) => {
      const key = `${cat}-${i}`;
      const isOpen = state.expandedSwaps[key];
      const saved = data.current.cals - sw.cals;
      html += `
        <div class="card" style="padding:0;overflow:hidden;cursor:pointer" data-swap="${key}">
          <div class="swap-header">
            <div style="flex:1">
              <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px">
                <span class="badge badge-green">-${saved} cal</span>
                <span class="badge ${sw.difficulty.includes('🟢') ? 'badge-green' : 'badge-yellow'}">${sw.difficulty}</span>
                <span class="badge badge-muted">${sw.sugar}</span>
              </div>
              <div style="font-size:14px;font-weight:600">${sw.name}</div>
            </div>
            <div style="text-align:right;margin-left:12px">
              <div style="font-size:16px;font-weight:700;color:var(--accent)">${sw.cals}</div>
              <div style="font-size:10px;color:var(--text-muted)">cal</div>
            </div>
          </div>
          <div class="swap-detail ${isOpen ? '' : 'hidden'}">
            <div class="macro-row" style="margin-bottom:8px">
              <span class="macro-p">P: ${sw.protein}g</span>
              <span class="macro-c">C: ${sw.carbs}g</span>
              <span class="macro-f">F: ${sw.fat}g</span>
            </div>
            <div class="swap-tip">💡 ${sw.tip}</div>
          </div>
        </div>`;
    });
  }
  return html;
}

function renderWeek() {
  let html = `<h2>Your Real Week</h2><p class="subtitle">Monday = cook & prep. Tue-Sun = fast food swaps + prepped snacks + 💊 supps daily.</p>`;
  
  WEEKLY_VIEW.forEach((day, i) => {
    html += `
      <div class="card ${i === 0 ? 'card-accent' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="color:${i === 0 ? 'var(--accent)' : 'var(--text)'}">${day.day}</h3>
          <span style="font-size:12px;font-weight:600;color:var(--accent)">${day.cals} cal</span>
        </div>
        <div style="font-size:12px;color:var(--text-dim);line-height:1.7">
          <div><strong style="color:var(--text)">AM:</strong> ${day.morning}</div>
          <div><strong style="color:var(--text)">Mid:</strong> ${day.midday}</div>

// === EVENT HANDLERS ===
function attachEvents() {
  // Swap toggles
  document.querySelectorAll('[data-swap]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.swap;
      state.expandedSwaps[key] = !state.expandedSwaps[key];
      renderContent();
    });
  });

  // Monday meal toggles
  document.querySelectorAll('[data-monday]').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.monday);
      state.expandedMonday = state.expandedMonday === i ? null : i;
      renderContent();
    });
  });

  // Water drops
  document.querySelectorAll('[data-water]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(el.dataset.water);
      state.waterCount = (i + 1 === state.waterCount) ? i : i + 1;
      save('bc_water', state.waterCount);
      renderContent();
    });
  });

  // Supplement buttons
  document.querySelectorAll('[data-supp]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.supp;
      state[key] = !state[key];
      const saveKey = SUPPS_DATA.find(s => s.stateKey === key).saveKey;
      save(saveKey, state[key]);
      renderContent();
    });
  });

  // Goto links
  document.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      state.activeTab = el.dataset.goto;
      renderTabs();
      renderContent();
    });
  });
}

// === INIT ===
renderTabs();
renderContent();
