server {
    listen 80;
    server_name 128.254.207.118;  # Changed to VPS IP
    root /var/www;

    # Hide the root path
    location = / {
        return 404;
    }

    # Serve the app here
    location /barber-cut/ {
        index index.html;
        try_files $uri $uri/ /barber-cut/index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
